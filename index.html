<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JaGUar Cinema | 2026 Cyber Premium</title>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        :root { 
            --neon-cyan: #00f2ff; --gold: #f39c12; --pink: #ff007f; --iaf-grey: #8d99ae;
            --hacker-gradient: linear-gradient(45deg, #ff007f, #00f2ff, #f39c12, #bc13fe);
        }

        body { margin: 0; background: #000; color: white; font-family: 'Rajdhani', sans-serif; overflow-x: hidden; display: flex; flex-direction: column; min-height: 100vh; }

        /* --- 1. SUBMARINE LOADER (Wapas Added) --- */
        #loader { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.8s; }
        .loader-content { position: relative; width: 200px; height: 120px; display: flex; justify-content: center; align-items: center; }
        .mini-sub { position: relative; width: 140px; height: 70px; z-index: 3; animation: subFloat 4s infinite ease-in-out; transform-style: preserve-3d; }
        .sub-body { width: 120px; height: 45px; background: linear-gradient(to bottom, #7f8c8d, #2c3e50); border-radius: 40px 100px 100px 40px; position: relative; box-shadow: inset -10px -5px 15px rgba(0,0,0,0.5), 0 0 15px var(--neon-cyan); }
        .sub-body::before { content: ''; position: absolute; top: 15px; left: 35px; width: 8px; height: 8px; background: #00d2ff; border-radius: 50%; box-shadow: 20px 0 0 #00d2ff, 40px 0 0 #00d2ff; border: 1px solid #000; }
        .missile-pod { position: absolute; bottom: 5px; left: 40px; width: 35px; height: 6px; background: #222; border: 1px solid var(--pink); box-shadow: 0 0 10px var(--pink); }
        .sub-tower { position: absolute; top: -18px; left: 45px; width: 30px; height: 25px; background: #4b5563; border-radius: 5px; border-top: 3px solid #95a5a6; }
        .propeller { position: absolute; left: -8px; top: 12px; width: 10px; height: 25px; background: #222; border-radius: 50%; animation: spin 0.4s infinite linear; }
        @keyframes spin { from { transform: rotateX(0deg); } to { transform: rotateX(360deg); } }
        @keyframes subFloat { 0%, 100% { transform: translateY(0) rotate(3deg); } 50% { transform: translateY(15px) rotate(-3deg); } }

        /* --- 2. HEADER & RAFALE (Wapas Added) --- */
        header { padding: 10px 5%; background: rgba(0,0,0,0.95); border-bottom: 2px solid; border-image: var(--hacker-gradient) 1; text-align: center; position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(10px); }
        .jaguar-text { font-family: 'Orbitron'; font-size: clamp(25px, 6vw, 40px); font-weight: 900; background: var(--hacker-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: hueRotate 5s infinite linear; }
        @keyframes hueRotate { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }
        .jet-window { width: 100%; height: 40px; position: relative; overflow: hidden; margin-top: 5px; }
        .rafale-iaf { width: 50px; height: 30px; position: absolute; animation: rafaleFly 5s infinite linear; filter: drop-shadow(0 0 8px var(--neon-cyan)); }
        @keyframes rafaleFly { 0% { left: -100px; transform: scale(0.6); } 100% { left: 110%; transform: scale(1.4); } }

        /* --- 3. MENU & NAVIGATION --- */
        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 10px; }
        .menu-btn { background: var(--neon-cyan); color: #000; border: none; padding: 8px 15px; border-radius: 5px; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; }
        .search-box { background: #111; border: 1px solid var(--neon-cyan); padding: 8px 15px; border-radius: 20px; color: white; flex: 1; max-width: 300px; outline: none; }

        /* --- 4. CATEGORY TABS (New) --- */
        .category-tabs { display: flex; overflow-x: auto; gap: 10px; padding: 15px 5%; scrollbar-width: none; }
        .category-tabs::-webkit-scrollbar { display: none; }
        .tab-btn { background: #111; border: 1px solid var(--neon-cyan); color: white; padding: 8px 20px; border-radius: 20px; white-space: nowrap; cursor: pointer; font-family: 'Orbitron'; font-size: 11px; transition: 0.3s; }
        .tab-btn.active { background: var(--neon-cyan); color: #000; box-shadow: 0 0 15px var(--neon-cyan); }

        /* --- 5. MOVIE GRID & AD SLOTS --- */
        .container { padding: 0 5% 20px; flex: 1; }
        .ad-slot { background: rgba(255,255,255,0.05); border: 1px dashed var(--neon-cyan); margin: 15px auto; padding: 10px; text-align: center; color: var(--gold); font-size: 11px; max-width: 728px; overflow: hidden; }
        
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        @media (min-width: 768px) { .movie-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); } }

        .movie-card { background: #0a0a0a; border-radius: 10px; overflow: hidden; position: relative; border: 1px solid #222; transition: 0.3s; cursor: pointer; }
        .movie-card:hover { transform: translateY(-8px); border-color: var(--neon-cyan); box-shadow: 0 0 20px rgba(0, 242, 255, 0.2); }
        .movie-card img { width: 100%; height: 220px; object-fit: cover; }
        .movie-title { padding: 10px; text-align: center; font-family: 'Orbitron'; font-size: 11px; color: #fff; height: 35px; overflow: hidden; }
        .cat-tag { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.7); border: 1px solid var(--pink); color: var(--pink); font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }

        /* --- 6. SIDE MENU & FOOTER (Wapas Added) --- */
        .side-menu { position: fixed; top: 0; left: -280px; width: 260px; height: 100%; background: #080808; z-index: 5000; transition: 0.4s; padding: 20px; border-right: 2px solid var(--pink); }
        .side-menu.active { left: 0; }
        .side-menu a { display: block; color: #fff; text-decoration: none; padding: 12px; border-bottom: 1px solid #111; font-family: 'Orbitron'; font-size: 12px; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 4000; display: none; }

        footer { background: #050505; border-top: 2px solid; border-image: var(--hacker-gradient) 1; padding: 40px 20px; text-align: center; margin-top: auto; }
        .f-links a { color: var(--neon-cyan); text-decoration: none; margin: 0 10px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- SUBMARINE LOADER -->
    <div id="loader">
        <div class="loader-content">
            <div class="mini-sub"><div class="propeller"></div><div class="sub-tower"></div><div class="sub-body"><div class="missile-pod"></div></div></div>
        </div>
        <h2 style="font-family:'Orbitron'; color:var(--neon-cyan); margin-top:30px; letter-spacing:4px; font-size: 14px;">SYSTEM_INITIALIZING...</h2>
    </div>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    
    <!-- SIDE MENU -->
    <div class="side-menu" id="sideMenu">
        <h3 style="color:var(--gold); font-family:'Orbitron';">CATEGORIES</h3>
        <a href="#" onclick="filterMovies('All')">ALL MOVIES</a>
        <a href="#" onclick="filterMovies('Bollywood')">BOLLYWOOD</a>
        <a href="#" onclick="filterMovies('Hollywood')">HOLLYWOOD</a>
        <a href="#" onclick="filterMovies('Animated')">ANIMATED</a>
        <a href="https://t.me" style="color:var(--neon-cyan); margin-top: 10px;">JOIN TELEGRAM</a>
        <button onclick="toggleMenu()" style="margin-top:20px; width:100%; background:red; color:white; border:none; padding:10px; cursor:pointer; font-weight: bold;">CLOSE</button>
    </div>

    <header>
        <div class="jaguar-text">JaGUar Cinema</div>
        <!-- RAFALE JET SVG -->
        <div class="jet-window">
            <svg class="rafale-iaf" viewBox="0 0 100 50"><path d="M10,25 L40,20 L80,25 L40,30 Z" fill="var(--iaf-grey)" stroke="var(--neon-cyan)"/></svg>
        </div>
        <div class="top-nav">
            <button class="menu-btn" onclick="toggleMenu()">☰</button>
            <input type="text" class="search-box" id="mSearch" placeholder="SEARCH MOVIES..." onkeyup="search()">
        </div>
    </header>

    <!-- CATEGORY TABS -->
    <div class="category-tabs">
        <button class="tab-btn active" onclick="filterMovies('All', this)">ALL</button>
        <button class="tab-btn" onclick="filterMovies('Bollywood', this)">BOLLYWOOD</button>
        <button class="tab-btn" onclick="filterMovies('Hollywood', this)">HOLLYWOOD</button>
        <button class="tab-btn" onclick="filterMovies('Animated', this)">ANIMATED</button>
    </div>

    <div class="container">
        <!-- TOP AD -->
        <div class="ad-slot">
            <script type="text/javascript">
                atOptions = { 'key' : '13683c613242723f7f0d3d473d8badfe', 'format' : 'iframe', 'height' : 90, 'width' : 728, 'params' : {} };
            </script>
            <script type="text/javascript" src="//://www.highperformanceformat.com"></script>
        </div>

        <div class="movie-grid" id="movieGrid"></div>

        <!-- BOTTOM AD -->
        <div class="ad-slot" style="border-color:var(--pink);">
            <script async="async" data-cfasync="false" src="https://pl28711762.effectivegatecpm.com"></script>
            <div id="container-9a437924caa885714adc8f3c6548e57d"></div>
        </div>
    </div>

    <footer>
        <div style="font-family:'Orbitron'; color:var(--neon-cyan); font-size:20px; margin-bottom:15px;">JaGUar_Cinema.sh</div>
        <div class="f-links">
            <a href="#">DMCA</a> | <a href="#">CONTACT</a> | <a href="#">ABOUT</a> | <a href="https://t.me">TELEGRAM</a>
        </div>
        <p style="color:#444; font-size:10px; margin-top:20px;">© 2026 SECURE ENCRYPTED INTERFACE // ALL RIGHTS RESERVED</p>
    </footer>

    <script>
        // MOVIES DATABASE (Aapki Movies)
        const movies = [
            { 
                title: "Pushpa 2: The Rule", 
                poster: "https://image.tmdb.org", 
                category: "Bollywood",
                link: "#"
            },
            { 
                title: "Avatar: Fire and Ash", 
                poster: "https://image.tmdb.org", 
                category: "Hollywood",
                link: "#"
            },
            { 
                title: "Singham Again", 
                poster: "https://image.tmdb.org", 
                category: "Bollywood",
                link: "#"
            },
            { 
                title: "Kung Fu Panda 4", 
                poster: "https://image.tmdb.org", 
                category: "Animated",
                link: "#"
            }
        ];

        function displayMovies(data) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = data.map(m => `
                <div class="movie-card" onclick="location.href='${m.link}'">
                    <div class="cat-tag">${m.category}</div>
                    <img src="${m.poster}" alt="${m.title}">
                    <div class="movie-title">${m.title}</div>
                </div>
            `).join('');
        }

        function filterMovies(cat, btn) {
            if(btn) {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
            if(cat === 'All') displayMovies(movies);
            else displayMovies(movies.filter(m => m.category === cat));
            if(document.getElementById('sideMenu').classList.contains('active')) toggleMenu();
        }

        function search() {
            const term = document.getElementById('mSearch').value.toLowerCase();
            displayMovies(movies.filter(m => m.title.toLowerCase().includes(term)));
        }

        function toggleMenu() {
            document.getElementById('sideMenu').classList.toggle('active');
            const ov = document.getElementById('overlay');
            ov.style.display = ov.style.display === 'block' ? 'none' : 'block';
        }

        window.onload = () => {
            setTimeout(() => {
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => document.getElementById('loader').style.display='none', 800);
            }, 1500);
            displayMovies(movies);
        };
    </script>
</body>
</html>
