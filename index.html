<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JaGUar Cinema | 2026 Cyber Premium</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet" />
  
  <style>
    :root {
      --neon-cyan: #00f2ff;
      --gold: #f39c12;
      --pink: #ff007f;
      --iaf-grey: #8d99ae;
      --hacker-gradient: linear-gradient(45deg, #ff007f, #00f2ff, #f39c12, #bc13fe);
    }

    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: "Rajdhani", sans-serif;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Loader same */
    #loader {
      position: fixed; inset: 0; background: #000; z-index: 10000;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    .mini-sub { position: relative; width: 140px; height: 70px; animation: subFloat 4s infinite ease-in-out; }
    .sub-body { width: 120px; height: 45px; background: linear-gradient(to bottom, #7f8c8d, #2c3e50); border-radius: 40px 100px 100px 40px; box-shadow: inset -10px -5px 15px rgba(0,0,0,0.5), 0 0 15px var(--neon-cyan); }
    .sub-body::before { content: ""; position: absolute; top: 15px; left: 35px; width: 8px; height: 8px; background: #00d2ff; border-radius: 50%; box-shadow: 20px 0 0 #00d2ff, 40px 0 0 #00d2ff; border: 1px solid #000; }
    .missile-pod { position: absolute; bottom: 5px; left: 40px; width: 35px; height: 6px; background: #222; border: 1px solid var(--pink); box-shadow: 0 0 10px var(--pink); }
    .sub-tower { position: absolute; top: -18px; left: 45px; width: 30px; height: 25px; background: #4b5563; border-radius: 5px; border-top: 3px solid #95a5a6; }
    .propeller { position: absolute; left: -8px; top: 12px; width: 10px; height: 25px; background: #222; border-radius: 50%; animation: spin 0.4s infinite linear; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes subFloat { 0%,100% { transform: translateY(0) rotate(3deg); } 50% { transform: translateY(15px) rotate(-3deg); } }

    header { padding: 10px 5%; background: rgba(0,0,0,0.95); border-bottom: 2px solid; border-image: var(--hacker-gradient) 1; text-align: center; position: sticky; top: 0; z-index: 1000; }
    .jaguar-text { font-family: "Orbitron"; font-size: clamp(28px, 6vw, 35px); font-weight: 900; background: var(--hacker-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: hueRotate 5s infinite linear; }
    @keyframes hueRotate { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }

    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; flex-wrap: wrap; gap: 10px; }
    .menu-btn { background: var(--neon-cyan); color: #000; border: none; padding: 8px 16px; border-radius: 6px; font-family: "Orbitron"; font-weight: 900; cursor: pointer; }
    .search-box { background: #111; border: 1px solid var(--neon-cyan); padding: 8px 14px; border-radius: 20px; color: white; flex: 1; max-width: 220px; outline: none; }

    .container { padding: 15px 4%; flex: 1; max-width: 1400px; margin: 0 auto; width: 100%; }

    .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }

    .movie-card { background: #0a0a0a; border-radius: 10px; overflow: hidden; border: 1px solid transparent; border-image: var(--hacker-gradient) 1; transition: 0.3s; cursor: pointer; }
    .movie-card:hover { transform: translateY(-8px); box-shadow: 0 0 20px var(--neon-cyan); }
    .movie-card img { width: 100%; height: 230px; object-fit: cover; }
    .movie-title { padding: 10px; text-align: center; font-family: "Orbitron"; font-size: 11px; height: 40px; overflow: hidden; }

    .side-menu { position: fixed; top: 0; left: -280px; width: 260px; height: 100%; background: #080808; z-index: 5000; transition: 0.4s; padding: 20px; border-right: 2px solid var(--pink); }
    .side-menu.active { left: 0; }
    .side-menu a { display: block; color: #fff; text-decoration: none; padding: 12px; border-bottom: 1px solid #111; font-family: "Orbitron"; font-size: 12px; cursor: pointer; }
    .side-menu a:hover { color: var(--neon-cyan); }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 4000; display: none; }

    .pagination { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin: 30px 0 40px; }
    .page-btn { background: #111; color: var(--neon-cyan); border: 1px solid var(--neon-cyan); padding: 8px 14px; border-radius: 6px; cursor: pointer; min-width: 40px; text-align: center; }
    .page-btn:hover { background: var(--neon-cyan); color: #000; }
    .page-btn.active { background: var(--pink); border-color: var(--pink); color: white; }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .dots { color: #555; padding: 8px; }

    footer { background: #050505; border-top: 2px solid; border-image: var(--hacker-gradient) 1; padding: 40px 20px; text-align: center; margin-top: auto; }

    /* ────────────────────────────────────────────────
       RESPONSIVE ADS STYLING - सबसे महत्वपूर्ण हिस्सा
    ──────────────────────────────────────────────── */
    .ad-slot {
      margin: 20px auto;
      text-align: center;
      overflow: hidden;
      max-width: 100%;
    }

    .ad-desktop { display: block; }
    .ad-mobile   { display: none; }

    @media (max-width: 767px) {
      .ad-desktop { display: none; }
      .ad-mobile   { display: block; }

      .ad-slot iframe,
      .ad-slot > div,
      .ad-slot > script + div {
        width: 100% !important;
        max-width: 320px !important;
        height: auto !important;
        margin: 0 auto;
      }

      /* कुछ ad networks के लिए extra safety */
      .ad-slot {
        padding: 0 10px;
      }
    }

    @media (min-width: 768px) {
      .ad-slot iframe,
      .ad-slot > div {
        max-width: 728px !important;
      }
    }

    /* Side skyscraper / vertical ads (160x600 or 300x250) */
    .ad-vertical {
      margin: 20px auto;
      max-width: 300px;
    }

    @media (max-width: 767px) {
      .ad-vertical {
        max-width: 320px;
      }
    }
  </style>
</head>
<body>

</div>

<header>

  <!-- TOP AD - Desktop & Mobile अलग-अलग -->

<script>
// तुम्हारा movies array, pagination, filter logic वही रहेगा (पिछले मैसेज वाला)
const movies = [ /* ... तुम्हारा पूरा array category के साथ ... */ ];

const moviesPerPage = 10;
let currentPage     = 1;
let currentCategory = null;
let currentSearch   = "";
let filteredMovies  = [];

function applyFilters() {
  filteredMovies = movies.filter(m => {
    const catMatch = !currentCategory || m.category === currentCategory;
    const searchMatch = !currentSearch || m.title.toLowerCase().includes(currentSearch);
    return catMatch && searchMatch;
  });
  currentPage = 1;
  renderMovies();
}

function renderMovies() {
  const grid = document.getElementById("movieGrid");
  const start = (currentPage - 1) * moviesPerPage;
  const pageMovies = filteredMovies.slice(start, start + moviesPerPage);

  grid.innerHTML = pageMovies.map(m => `
    <div class="movie-card" onclick="window.open('${m.link}', '_blank')">
      <img src="${m.poster}" alt="${m.title}" onerror="this.src='https://via.placeholder.com/160x230?text=No+Poster';">
      <div class="movie-title">${m.title}</div>
    </div>
  `).join("");

  renderPagination();
}

function renderPagination() {
  const totalPages = Math.ceil(filteredMovies.length / moviesPerPage);
  const pag = document.getElementById("pagination");
  pag.innerHTML = "";

  if (totalPages <= 1) return;

  pag.innerHTML += `<button class="page-btn" ${currentPage <= 1 ? 'disabled' : ''} onclick="changePage(${currentPage-1})">← Prev</button>`;

  for (let i = 1; i <= totalPages; i++) {
    if (Math.abs(i - currentPage) <= 2 || i === 1 || i === totalPages) {
      pag.innerHTML += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
    } else if (pag.lastChild?.textContent !== "...") {
      pag.innerHTML += `<span class="dots">...</span>`;
    }
  }

  pag.innerHTML += `<button class="page-btn" ${currentPage >= totalPages ? 'disabled' : ''} onclick="changePage(${currentPage+1})">Next →</button>`;
}

function changePage(page) {
  const max = Math.ceil(filteredMovies.length / moviesPerPage);
  if (page < 1 || page > max) return;
  currentPage = page;
  renderMovies();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function filterByCategory(cat) {
  currentCategory = cat;
  applyFilters();
  toggleMenu();
}

function search() {
  currentSearch = document.getElementById("mSearch").value.toLowerCase().trim();
  applyFilters();
}

function toggleMenu() {
  const menu = document.getElementById("sideMenu");
  const overlay = document.getElementById("overlay");
  menu.classList.toggle("active");
  overlay.style.display = menu.classList.contains("active") ? "block" : "none";
}

window.onload = () => {
  applyFilters();
  setTimeout(() => {
    document.getElementById("loader").style.display = "none";
  }, 2000);
};
</script>
