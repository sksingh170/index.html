<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JaGUar Cinema | Cyber Premium 2026</title>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        :root { 
            --neon-cyan: #00f2ff; --gold: #f39c12; --pink: #ff007f;
            --hacker-gradient: linear-gradient(45deg, #ff007f, #00f2ff, #f39c12, #bc13fe);
        }

        body { margin: 0; background: #050505; color: white; font-family: 'Rajdhani', sans-serif; overflow-x: hidden; }

        /* --- SMART LOADER --- */
        #loader { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.8s; }
        .sub-body { width: 100px; height: 35px; background: linear-gradient(to bottom, #7f8c8d, #2c3e50); border-radius: 40px 100px 100px 40px; position: relative; box-shadow: 0 0 15px var(--neon-cyan); }
        
        /* --- RESPONSIVE HEADER --- */
        header { padding: 15px 5%; background: rgba(0,0,0,0.9); border-bottom: 2px solid var(--neon-cyan); text-align: center; position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(10px); }
        .jaguar-text { font-family: 'Orbitron'; font-size: clamp(24px, 5vw, 40px); font-weight: 900; background: var(--hacker-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: hue 5s infinite linear; }
        @keyframes hue { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }

        /* --- SMART AD SLOTS (Responsive) --- */
        .ad-slot { 
            background: rgba(255,255,255,0.03); border: 1px dashed var(--neon-cyan); 
            margin: 10px auto; padding: 5px; text-align: center; 
            max-width: 100%; overflow: hidden; min-height: 50px;
        }
        @media (max-width: 600px) { .ad-slot iframe { transform: scale(0.8); } }

        /* --- CATEGORY TABS --- */
        .category-bar { display: flex; justify-content: center; gap: 10px; margin: 20px 0; flex-wrap: wrap; }
        .tab-btn { 
            background: transparent; border: 1px solid var(--neon-cyan); color: white; 
            padding: 8px 15px; border-radius: 20px; cursor: pointer; font-family: 'Orbitron'; font-size: 12px; transition: 0.3s;
        }
        .tab-btn.active { background: var(--neon-cyan); color: #000; box-shadow: 0 0 15px var(--neon-cyan); }

        /* --- SMART MOVIE GRID --- */
        .container { padding: 10px 5%; }
        .movie-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
            gap: 15px; 
        }
        @media (min-width: 768px) { .movie-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); } }

        .movie-card { 
            background: #111; border-radius: 12px; overflow: hidden; position: relative; 
            border: 1px solid #222; transition: 0.4s;
        }
        .movie-card:hover { transform: scale(1.05); border-color: var(--pink); box-shadow: 0 0 20px rgba(255, 0, 127, 0.3); }
        .movie-card img { width: 100%; height: 210px; object-fit: cover; }
        .movie-title { padding: 10px; text-align: center; font-family: 'Orbitron'; font-size: 11px; color: #eee; }
        .movie-badge { position: absolute; top: 5px; right: 5px; background: var(--pink); font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }

        /* --- SIDE MENU --- */
        .side-menu { position: fixed; top: 0; left: -280px; width: 260px; height: 100%; background: #080808; z-index: 5000; transition: 0.4s; padding: 20px; border-right: 2px solid var(--neon-cyan); }
        .side-menu.active { left: 0; }
        .side-menu a { display: block; color: #fff; text-decoration: none; padding: 12px; border-bottom: 1px solid #111; font-family: 'Orbitron'; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 4000; display: none; }

        footer { background: #000; border-top: 1px solid #222; padding: 30px; text-align: center; margin-top: 50px; font-size: 12px; }
    </style>
</head>
<body>

<div id="loader">
    <div class="sub-body"></div>
    <h2 style="font-family:'Orbitron'; color:var(--neon-cyan); margin-top:20px;">LOADING...</h2>
</div>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>
<div class="side-menu" id="sideMenu">
    <h3 style="color:var(--gold); font-family:'Orbitron';">GENRES</h3>
    <a href="#" onclick="filterMovies('All')">ALL MOVIES</a>
    <a href="#" onclick="filterMovies('Bollywood')">BOLLYWOOD</a>
    <a href="#" onclick="filterMovies('Hollywood')">HOLLYWOOD</a>
    <a href="#" onclick="filterMovies('Animated')">ANIMATED</a>
    <hr>
    <a href="https://t.me" style="color:var(--neon-cyan)">JOIN TELEGRAM</a>
</div>

<header>
    <div class="jaguar-text">JaGUar Cinema</div>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
        <button onclick="toggleMenu()" style="background:var(--neon-cyan); border:none; padding:8px 12px; border-radius:5px; font-weight:bold; cursor:pointer;">MENU</button>
        <input type="text" id="mSearch" placeholder="Search movies..." onkeyup="search()" style="background:#111; border:1px solid var(--neon-cyan); color:white; padding:8px; border-radius:20px; width:60%;">
    </div>
</header>

<div class="container">
    <!-- TOP AD -->
    <div class="ad-slot">
        <!-- Paste Top Ad Code Below -->
        <script type="text/javascript">
            atOptions = { 'key' : '13683c613242723f7f0d3d473d8badfe', 'format' : 'iframe', 'height' : 90, 'width' : 728, 'params' : {} };
        </script>
        <script type="text/javascript" src="//www.highperformanceformat.com/13683c613242723f7f0d3d473d8badfe/invoke.js"></script>
    </div>

    <div class="category-bar">
        <button class="tab-btn active" onclick="filterMovies('All', this)">ALL</button>
        <button class="tab-btn" onclick="filterMovies('Bollywood', this)">BOLLYWOOD</button>
        <button class="tab-btn" onclick="filterMovies('Hollywood', this)">HOLLYWOOD</button>
        <button class="tab-btn" onclick="filterMovies('Animated', this)">ANIMATED</button>
    </div>

    <div class="movie-grid" id="movieGrid"></div>

    <!-- BOTTOM AD -->
    <div class="ad-slot" style="border-color:var(--pink); margin-top:30px;">
        <!-- Paste Bottom Native Ad Code Below -->
        <script async="async" data-cfasync="false" src="https://pl28711762.effectivegatecpm.com/9a437924caa885714adc8f3c6548e57d/invoke.js"></script>
        <div id="container-9a437924caa885714adc8f3c6548e57d"></div>
    </div>
</div>

<footer>
    <p>© 2026 JaGUar Cinema | Secure Cyber Interface</p>
</footer>

<script>
    // MOVIE DATABASE (Yahan Category add karein)
    const movies = [
        { 
            title: "Pushpa 2: The Rule", 
            poster: "https://image.tmdb.org", 
            category: "Bollywood",
            link: "#"
        },
        { 
            title: "Avatar: Fire and Ash", 
            poster: "https://image.tmdb.org", 
            category: "Hollywood",
            link: "#"
        },
        { 
            title: "Kung Fu Panda 4", 
            poster: "https://image.tmdb.org", 
            category: "Animated",
            link: "#"
        }
    ];

    function displayMovies(data) {
        const grid = document.getElementById('movieGrid');
        grid.innerHTML = data.map(m => `
            <div class="movie-card" onclick="location.href='${m.link}'">
                <span class="movie-badge">${m.category}</span>
                <img src="${m.poster}" alt="${m.title}">
                <div class="movie-title">${m.title}</div>
            </div>
        `).join('');
    }

    function filterMovies(cat, btn) {
        if(btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
        if(cat === 'All') displayMovies(movies);
        else displayMovies(movies.filter(m => m.category === cat));
        if(document.getElementById('sideMenu').classList.contains('active')) toggleMenu();
    }

    function search() {
        const term = document.getElementById('mSearch').value.toLowerCase();
        displayMovies(movies.filter(m => m.title.toLowerCase().includes(term)));
    }

    function toggleMenu() {
        document.getElementById('sideMenu').classList.toggle('active');
        const ov = document.getElementById('overlay');
        ov.style.display = ov.style.display === 'block' ? 'none' : 'block';
    }

    window.onload = () => {
        setTimeout(() => document.getElementById('loader').style.display='none', 1000);
        displayMovies(movies);
    };
</script>
</body>
</html>
