<!DOCTYPE html>

<head>

    <title>JaGUar Cinema | Hollywood & Bollywood</title>

    <style>
        :root { --primary: #ff9800; --bg: #0f0f0f; --card: #1e1e1e; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; }
        
        /* Header & Menu */
        header { background: #1a1a1a; padding: 10px 5%; border-bottom: 2px solid var(--primary); }
        .nav-container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .logo { font-size: 24px; font-weight: bold; color: var(--primary); }
        nav ul { list-style: none; display: flex; gap: 20px; padding: 0; }
        nav a { color: white; text-decoration: none; font-weight: 500; transition: 0.3s; }
        nav a:hover { color: var(--primary); }

        /* Search & Ads */
        .search-box { text-align: center; padding: 20px; }
        #mSearch { width: 60%; padding: 12px; border-radius: 25px; border: none; outline: none; }
        .ad-unit { margin: 15px auto; display: flex; justify-content: center; overflow: hidden; }

        /* Categories & Grid */
        .category-title { padding-left: 5%; color: var(--primary); border-left: 4px solid var(--primary); margin: 30px 0 15px 5%; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; padding: 0 5% 20px; }
        .movie-card { background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid #333; transition: 0.3s; text-align: center; }
        .movie-card:hover { transform: translateY(-5px); border-color: var(--primary); }
        .movie-card img { width: 100%; height: 240px; object-fit: cover; }
        .movie-card h4 { font-size: 13px; margin: 10px; height: 32px; overflow: hidden; }
        .movie-card .btn { display: block; background: var(--primary); color: black; padding: 8px; text-decoration: none; font-weight: bold; margin: 10px; border-radius: 6px; font-size: 12px; }

        footer { background: #1a1a1a; padding: 30px; text-align: center; border-top: 2px solid var(--primary); margin-top: 40px; }
    </style>
</head>
<body>

<header>

        <!-- Ad 5: Header Banner -->

</header>

<script>
    const movies = [
        { title: "Srikanth (2024)", cat: "Bollywood", poster: "https://www.myhowbaat.com", link: "https://shrtree.link" },
        { title: "Munjya (2024)", cat: "Bollywood", poster: "https://blogger.googleusercontent.com", link: "https://shrtree.link" },
        { title: "Maharaja (2024)", cat: "Bollywood", poster: "https://blogger.googleusercontent.com", link: "https://shrtree.link" },
        { title: "Chandu Champion (2024)", cat: "Bollywood", poster: "https://blogger.googleusercontent.com", link: "https://shrtree.link" },
        { title: "The Amazing Spider-Man", cat: "Hollywood", poster: "https://www.myhowbaat.com", link: "https://shrtree.link" },
        { title: "Hobbs and Shaw", cat: "Hollywood", poster: "https://www.myhowbaat.com", link: "https://shrtree.link" },
        { title: "Fast and Furious 9", cat: "Hollywood", poster: "https://www.myhowbaat.com", link: "https://shrtree.link" },
        { title: "Iraivan (2023)", cat: "Bollywood", poster: "https://www.myhowbaat.com", link: "https://shrtree.link" },
        { title: "Spider-Man 2", cat: "Hollywood", poster: "https://www.myhowbaat.com", link: "https://shrtree.link" }
    ];

    function showMovies(data) {
        const grid = document.getElementById('main-display');
        grid.innerHTML = data.map(m => `
            <div class="movie-card">
                <img src="${m.poster}" alt="${m.title}">
                <h4>${m.title}</h4>
                <a href="${m.link}" class="btn">Download Now</a>
            </div>
        `).join('');
    }

    function filterCat(cat) {
        document.getElementById('cat-title').innerText = cat + " Movies";
        const filtered = cat === 'All' ? movies : movies.filter(m => m.cat === cat);
        showMovies(filtered);
    }

    function searchMovies() {
        const term = document.getElementById('mSearch').value.toLowerCase();
        const results = movies.filter(m => m.title.toLowerCase().includes(term));
        showMovies(results);
    }

    window.onload = () => showMovies(movies);
</script>

</body>
