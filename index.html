<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Collection</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="loader">
        <div class="submarine-loader">
            <!-- Submarine loader animation goes here -->
        </div>
    </div>

    <header>
        <h1>Movie Collection</h1>
        <div class="search-container">
            <input type="text" id="search" placeholder="Search for movies...">
        </div>
    </header>

    <main>
        <div class="category-filter">
            <button data-category="all">All</button>
            <button data-category="action">Action</button>
            <button data-category="drama">Drama</button>
            <button data-category="comedy">Comedy</button>
            <!-- More categories can be added -->
        </div>

        <div class="pagination">
            <button id="prev">Previous</button>
            <button id="next">Next</button>
        </div>

        <div class="movie-grid">
            <!-- Insert all 24 movies here with animations -->
            <div class="movie" data-category="action">
                <h2>Movie 1</h2>
                <p>Description of Movie 1</p>
                <!-- Animation for Rafale jet goes here -->
            </div>
            <div class="movie" data-category="drama">
                <h2>Movie 2</h2>
                <p>Description of Movie 2</p>
                <!-- Animation for Rafale jet goes here -->
            </div>
            <!-- Repeat for all 24 movies -->
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Movie Collection</p>
    </footer>
</body>
</html>
